[project]
name = "absorg"
version = "2.3.6"
description = "Organise audiobook files for Audiobookshelf"
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47"]

[project.scripts]
absorg = "absorg.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["build>=1.6.1,<2", "pytest>=7.0", "ruff>=0.5", "setuptools>=68.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["absorg*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
